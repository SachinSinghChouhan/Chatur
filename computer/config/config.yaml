# Computer Voice Assistant Configuration

# Speech-to-Text Engine Selection
stt:
  engine: "local_whisper"  # Options: local_whisper, vosk, google, whisper (cloud), azure
  # Azure settings
  azure_region: "centralindia"
  azure_timeout_ms: 8000
  # Vosk settings
  vosk_model_path: "vosk-model"  # Path to Vosk model directory

# Local Whisper STT (faster-whisper, runs fully on-device)
# Model is downloaded automatically on first run to ~/.cache/huggingface/hub/
whisper:
  model: "base"          # tiny (~150MB) | base (~300MB) | small (~500MB) | medium (~1.5GB)
  device: "cpu"          # cpu | cuda  (set cuda if you have an NVIDIA GPU)
  compute_type: "int8"   # int8 (fastest on CPU) | float16 (GPU) | float32

# Default Browser
browser:
  default: "brave"  # Options: brave, chrome, firefox, edge
  fallback_order:
    - brave
    - chrome
    - firefox
    - edge

# Wake Word Detection
wake_word:
  enabled: false        # Set to true to enable wake word detection
  engine: "openwakeword"  # "openwakeword" (free, no key) or "porcupine" (needs PORCUPINE_ACCESS_KEY)
  model: "hey_jarvis"   # openWakeWord pre-trained model (hey_jarvis, alexa, hey_mycroft, ...)
  threshold: 0.5        # Detection confidence threshold (0.0–1.0)
  # Porcupine-only settings:
  keyword: "computer"
  sensitivity: 0.5

# Azure Speech Services
azure:
  region: "centralindia"
  languages:
    - "en-IN"
  stt_timeout_ms: 8000  # Initial silence timeout
  stt_end_silence_ms: 2000  # End silence timeout

# LLM Provider
# Set provider to "ollama" for fully local/offline operation (no API key needed).
# Requires Ollama running locally: https://ollama.com
llm:
  provider: "ollama"       # "ollama" (local, no API key) or "openai"
  ollama_base_url: "http://localhost:11434/v1"
  ollama_model: "mistral"  # Any model you have pulled: mistral, llama3, gemma2, etc.

# OpenAI Configuration (used when llm.provider == "openai")
openai:
  model: "gpt-3.5-turbo"
  max_tokens: 150
  temperature: 0.7

# Weather
weather:
  default_city: "Delhi"  # Change to your city
  units: "metric"  # imperial (°F), metric (°C), or standard (K)

# Text-to-Speech
tts:
  rate: 150  # Words per minute
  volume: 0.9  # 0.0 to 1.0
  use_transliteration: true  # Fallback for Hindi when voice not available

# Reminder & Timer Scheduler
scheduler:
  check_interval_seconds: 30  # How often to check for due reminders
  reminder_window_seconds: 30  # ±30 seconds window for triggering
  max_conversation_history: 100

# File Search
file_search:
  search_locations:
    - "~/Desktop"
    - "~/Documents"
    - "~/Downloads"
    - "~"  # Home directory
    # Windows-specific paths are added automatically via get_default_file_search_paths()
  max_results: 10
  timeout_seconds: 30
  supported_extensions:
    - pdf
    - docx
    - doc
    - xlsx
    - xls
    - pptx
    - ppt
    - txt
    - jpg
    - jpeg
    - png
    - gif
    - mp4
    - mp3
    - zip
    - rar
    - exe

# URL Detection
url_detection:
  supported_tlds:
    - com
    - org
    - net
    - in
    - io
    - co
    - edu
    - gov
    - site
    - xyz
    - app
  auto_add_https: true

# Media Control
media_control:
  volume_step: 2  # Percentage to increase/decrease volume
  use_exact_volume: true  # Use COM interface for exact volume control

# App Launch
app_launch:
  recognized_apps:
    - brave
    - chrome
    - firefox
    - edge
    - calculator
    - notepad
    - gmail
    - explorer
    - whatsapp
    - spotify
  browser_close_apps:  # Process name stems used to close browsers (cross-platform, no .exe needed)
    - chrome
    - chromium
    - firefox
    - msedge
    - brave

# Language Detection
language:
  default: "en"
  supported_languages:
    - en

# System Tray
system_tray:
  auto_start_service: true
  show_notifications: true
  icon_update_interval_seconds: 2
  menu_update_delay_ms: 500

# Service Manager
service:
  restart_on_error: true
  shutdown_timeout_seconds: 5
  restart_delay_seconds: 0.5

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  max_file_size_mb: 10
  backup_count: 5
  log_directory: "logs"
  console_output: true
  file_output: true

# Database
database:
  path: "~/.computer/computer.db"  # Will be expanded to AppData/Roaming
  backup_enabled: true
  backup_interval_hours: 24

# Performance
performance:
  llm_cache_enabled: false
  max_concurrent_handlers: 5
  command_timeout_seconds: 30
