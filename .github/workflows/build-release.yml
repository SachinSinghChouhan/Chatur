name: Build & Release Chatur

on:
  push:
    tags:
      - 'v*'          # triggers on: git tag v1.0.0 && git push --tags
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  # ─── Build React UI (shared artifact used by both platform builds) ────────────
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: computer/ui/package-lock.json

      - name: Build React UI (desktop mode)
        working-directory: computer/ui
        run: |
          npm ci
          npm run build -- --mode desktop

      - name: Upload UI dist
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: computer/ui/dist/
          retention-days: 1

  # ─── Ubuntu build ─────────────────────────────────────────────────────────────
  build-ubuntu:
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            portaudio19-dev \
            espeak \
            espeak-ng \
            libespeak-ng-dev \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: computer/requirements.txt

      - name: Install Python dependencies
        working-directory: computer
        run: pip install -r requirements.txt

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: computer/ui/dist/

      - name: Build Ubuntu binary
        working-directory: computer
        run: python build.py

      - name: Upload Ubuntu binary
        uses: actions/upload-artifact@v4
        with:
          name: ChaturAssistant-Ubuntu
          path: computer/dist/ChaturAssistant

  # ─── Windows build ────────────────────────────────────────────────────────────
  build-windows:
    needs: build-ui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: computer/requirements.txt

      - name: Install Python dependencies
        working-directory: computer
        run: pip install -r requirements.txt

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: computer/ui/dist/

      - name: Build Windows executable
        working-directory: computer
        run: python build.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ChaturAssistant-Windows
          path: computer/dist/ChaturAssistant.exe

  # ─── Create GitHub Release with both binaries ─────────────────────────────────
  release:
    needs: [build-ubuntu, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create releases
    steps:
      - name: Download Ubuntu binary
        uses: actions/download-artifact@v4
        with:
          name: ChaturAssistant-Ubuntu
          path: artifacts/

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: ChaturAssistant-Windows
          path: artifacts/

      - name: Make Ubuntu binary executable
        run: chmod +x artifacts/ChaturAssistant

      - name: Rename artifacts
        run: |
          mv artifacts/ChaturAssistant     artifacts/ChaturAssistant-linux-x64
          mv artifacts/ChaturAssistant.exe artifacts/ChaturAssistant-windows-x64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Chatur ${{ github.ref_name }}"
          body: |
            ## Chatur Voice Assistant ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows 10/11 | `ChaturAssistant-windows-x64.exe` |
            | Ubuntu 20.04+ | `ChaturAssistant-linux-x64` |

            ### Setup
            1. Download the file for your platform
            2. Create a `.env` file next to the executable:
               ```
               OPENAI_API_KEY=your_key_here
               AZURE_SPEECH_KEY=your_key_here
               AZURE_SPEECH_REGION=centralindia
               ```
            3. Run the executable

            ### Ubuntu: make it executable first
            ```bash
            chmod +x ChaturAssistant-linux-x64
            ./ChaturAssistant-linux-x64
            ```
          files: |
            artifacts/ChaturAssistant-linux-x64
            artifacts/ChaturAssistant-windows-x64.exe
          draft: false
          prerelease: false
