name: Build & Release Chatur

on:
  push:
    tags:
      - 'v*'          # triggers on: git tag v1.0.0 && git push --tags
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  # ─── Build React UI (shared artifact used by both platform builds) ────────────
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: computer/ui/package-lock.json

      - name: Build React UI (desktop mode)
        working-directory: computer/ui
        run: |
          npm ci
          npm run build -- --mode desktop

      - name: Upload UI dist
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: computer/ui/dist/
          retention-days: 1

  # ─── Ubuntu build ─────────────────────────────────────────────────────────────
  build-ubuntu:
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            portaudio19-dev \
            espeak \
            espeak-ng \
            libespeak-ng-dev \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: computer/requirements.txt

      - name: Install Python dependencies
        working-directory: computer
        run: pip install -r requirements.txt

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: computer/ui/dist/

      - name: Build Ubuntu binary
        working-directory: computer
        run: python build.py

      - name: Package as .deb
        run: |
          # Extract version from tag (e.g. v1.0.0 → 1.0.0), fallback to 1.0.0
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION:-1.0.0}"

          PKG="chatur_${VERSION}_amd64"
          mkdir -p "$PKG/DEBIAN"
          mkdir -p "$PKG/usr/local/bin"
          mkdir -p "$PKG/usr/share/applications"
          mkdir -p "$PKG/usr/share/doc/chatur"

          # Binary
          cp computer/dist/ChaturAssistant "$PKG/usr/local/bin/chatur"
          chmod +x "$PKG/usr/local/bin/chatur"

          # Control file
          cat > "$PKG/DEBIAN/control" << EOF
          Package: chatur
          Version: $VERSION
          Architecture: amd64
          Maintainer: Sachin Singh Chouhan <sachinsinghchouhan@github.com>
          Depends: libportaudio2, espeak-ng, libgtk-3-0
          Description: Chatur Voice Assistant
           A bilingual (English/Hindi) desktop voice assistant.
           Speak naturally to control your computer — set reminders,
           search files, open apps, and more. Works offline with
           local STT and LLM support.
          EOF

          # Desktop entry (shows in app launcher)
          cat > "$PKG/usr/share/applications/chatur.desktop" << EOF
          [Desktop Entry]
          Name=Chatur Assistant
          Comment=Bilingual voice assistant for your desktop
          Exec=/usr/local/bin/chatur
          Icon=chatur
          Type=Application
          Categories=Utility;Accessibility;
          Keywords=voice;assistant;speech;
          StartupNotify=true
          EOF

          # Copyright
          cat > "$PKG/usr/share/doc/chatur/copyright" << EOF
          Chatur Voice Assistant
          Copyright 2026 Sachin Singh Chouhan
          License: MIT
          EOF

          # Build .deb (output is already named chatur_${VERSION}_amd64.deb)
          dpkg-deb --build --root-owner-group "$PKG"

      - name: Upload Ubuntu binary
        uses: actions/upload-artifact@v4
        with:
          name: ChaturAssistant-Ubuntu
          path: computer/dist/ChaturAssistant

      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: ChaturAssistant-deb
          path: chatur_*_amd64.deb

  # ─── Windows build ────────────────────────────────────────────────────────────
  build-windows:
    needs: build-ui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: computer/requirements.txt

      - name: Install Python dependencies
        working-directory: computer
        run: pip install -r requirements.txt

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: computer/ui/dist/

      - name: Build Windows executable
        working-directory: computer
        run: python build.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ChaturAssistant-Windows
          path: computer/dist/ChaturAssistant.exe

  # ─── Create GitHub Release with both binaries ─────────────────────────────────
  release:
    needs: [build-ubuntu, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create releases
    steps:
      - name: Download Ubuntu binary
        uses: actions/download-artifact@v4
        with:
          name: ChaturAssistant-Ubuntu
          path: artifacts/

      - name: Download .deb package
        uses: actions/download-artifact@v4
        with:
          name: ChaturAssistant-deb
          path: artifacts/

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: ChaturAssistant-Windows
          path: artifacts/

      - name: Make Ubuntu binary executable
        run: chmod +x artifacts/ChaturAssistant

      - name: Rename raw binary
        run: |
          mv artifacts/ChaturAssistant     artifacts/ChaturAssistant-linux-x64
          mv artifacts/ChaturAssistant.exe artifacts/ChaturAssistant-windows-x64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Chatur ${{ github.ref_name }}"
          body: |
            ## Chatur Voice Assistant ${{ github.ref_name }}

            ### Downloads
            | Platform | File | How to install |
            |----------|------|----------------|
            | Windows 10/11 | `ChaturAssistant-windows-x64.exe` | Double-click to run |
            | Ubuntu 20.04+ (recommended) | `chatur_*_amd64.deb` | `sudo dpkg -i chatur_*_amd64.deb` |
            | Ubuntu 20.04+ (raw binary) | `ChaturAssistant-linux-x64` | `chmod +x` then run |

            ### Setup after install
            Create a `.env` file next to the executable (or at `~/.config/chatur/.env`):
            ```
            OPENAI_API_KEY=your_key_here
            AZURE_SPEECH_KEY=your_key_here
            AZURE_SPEECH_REGION=centralindia
            ```

            ### Ubuntu .deb install
            ```bash
            sudo dpkg -i chatur_${{ github.ref_name }}_amd64.deb
            # Install any missing dependencies:
            sudo apt-get install -f
            # Run:
            chatur
            ```
          files: |
            artifacts/ChaturAssistant-linux-x64
            artifacts/ChaturAssistant-windows-x64.exe
            artifacts/chatur_*_amd64.deb
          draft: false
          prerelease: false
